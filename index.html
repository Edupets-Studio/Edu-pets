<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edupets - Inicio</title>
  <link rel="stylesheet" href="Estilos/index.css">
  <link rel="icon" type="image/png" href="imagenes/Logo.png">
 
</head>
<body>
  <iframe src="player.html" style="display:none;" allow="autoplay"></iframe>
  <div class="container">
    <div class="sidebar">
      <img src="imagenes/Logo.png" alt="Logo Edupets" />
      <a href="login.html" class="start-button">Comenzar</a>
    </div>
    <div class="main-content">
      <a href="que es.html" class="help-button">?</a>
      
      <script>
        const symbols = ['+', '−', '×', '÷', '=', '≠', '<', '>', '∞', '∑', '∫', 'π', '√', '%', '±'];
        const container = document.querySelector('.main-content');
        for (let i = 0; i < 40; i++) {
          const symbol = document.createElement('div');
          symbol.classList.add('symbol');
          symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          symbol.style.top = Math.random() * 100 + '%';
          symbol.style.left = Math.random() * 100 + '%';
          symbol.style.fontSize = (Math.random() * 1.5 + 1) + 'em';
          symbol.style.animationDuration = (Math.random() * 15 + 8) + 's';
          container.appendChild(symbol);
        }
      </script>
    </div>
  </div>
</body>
</html>
