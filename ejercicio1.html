<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suma - Juego</title>
  <style>
  body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive, sans-serif;
  background-color: #eaf1f8;
}

.header {
  background-color: #79b5e8;
  color: white;
  padding: 25px;
  font-size: 2.8em;
  text-align: center;
  border-radius: 0 0 20px 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.container {
  text-align: center;
  padding: 50px 20px;
}

.hearts {
  position: absolute;
  top: 15px;
  right: 25px;
}

.hearts img {
  width: 55px;
  height: 55px;
  margin-left: 10px;
}

.penguin {
  width: 200px;
  display: block;
  margin: 40px auto 20px;
  animation: float 2s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

.question {
  background-color: #c2dcf7;
  display: inline-block;
  padding: 20px 60px;
  border-radius: 20px;
  font-size: 2.3em;
  color: #000;
  margin: 25px 0 50px;
}

.options {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 50px;
}

.options button {
  background-color: #d6f5d6;
  border: none;
  border-radius: 50%;
  width: 150px;
  height: 150px;
  font-size: 2.5em;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
}

.options button:hover {
  transform: scale(1.1);
  background-color: #bff2bf;
}

.message {
  font-size: 2em;
  margin-top: 40px;
}

.arrow {
  position: absolute;
  bottom: 30px;
  left: 30px;
  background-color: #c2dcf7;
  padding: 15px 25px;
  border-radius: 15px;
  font-size: 1.8em;
  cursor: pointer;
  transition: background-color 0.3s, transform 0.2s;
  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
}

.arrow:hover {
  background-color: #a5c8f3;
  transform: scale(1.05);
}

.confirm-exit {
  display: none;
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: #fff;
  padding: 35px;
  border-radius: 15px;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
  text-align: center;
  z-index: 9999;
}

.confirm-exit p {
  font-size: 1.6em;
  margin-bottom: 25px;
}

.confirm-exit button {
  font-size: 1.5em;
  margin: 15px;
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.2s;
}

.confirm-exit button:hover {
  transform: scale(1.05);
}

.btn-salir {
  background-color: #fbc9cc;
}

.btn-quedar {
  background-color: #c8f5c1;
}
    </style>

</head>
  <iframe src="player.html" style="display:none;" allow="autoplay"></iframe>
<body>
  <div class="header" id="titulo">Suma: Ejercicio de ?</div>
  <div class="hearts">
    <img src="imagenes/Vida.png" id="vida1">
    <img src="imagenes/Vida.png" id="vida2">
    <img src="imagenes/Vida.png" id="vida3">
  </div>
  <div class="container">
    <img src="imagenes/pet.png" alt="Pingüino" class="penguin">
    <div class="question" id="pregunta">¿Cuánto es ?</div>
    <div class="options" id="opciones"></div>
    <div id="mensaje"></div>
  </div>
  <div class="arrow left" style="position: absolute; bottom: 30px; left: 30px; font-size: 2em; background-color: #fbc9cc; padding: 15px 25px; border-radius: 15px; cursor: pointer;" onclick="confirmarSalida()">Volver</div>

  <div class="confirm-exit" id="confirm-exit">
    <p style="font-size: 1.5em;">¿Estás seguro de que quieres salir de la prueba?</p>
    <button class="btn-salir" onclick="window.location.href='mascota.html'">Sí, volver</button>
    <button class="btn-quedar" onclick="document.getElementById('confirm-exit').style.display='none'">No, me quiero quedar</button>
  </div>

  <script>
  let vidas = 3;
  let preguntas = 0;
  const totalPreguntas = 10;
  const mensajeDiv = document.getElementById('mensaje');

  function aumentarOrbe(orbe) {
    const niveles = JSON.parse(localStorage.getItem('niveles')) || {
      comida: 100,
      sueño: 100,
      felicidad: 100
    };
    const timestamps = JSON.parse(localStorage.getItem('ultimosIncrementos')) || {
      comida: 0,
      sueño: 0,
      felicidad: 0
    };
    const ahora = Date.now();
    const tiempoEspera = 60 * 1000;
    if (ahora - timestamps[orbe] > tiempoEspera) {
      niveles[orbe] = Math.min(100, niveles[orbe] + 20);
      timestamps[orbe] = ahora;
      localStorage.setItem('niveles', JSON.stringify(niveles));
      localStorage.setItem('ultimosIncrementos', JSON.stringify(timestamps));
    }
  }

  function generarNumeroFacil() {
    return Math.floor(Math.random() * 10) + 1;
  }

  function generarPregunta() {
    mensajeDiv.innerHTML = "";
    if (preguntas >= totalPreguntas) {
      mensajeDiv.innerHTML = '<div class="message success">🎉 ¡Excelente trabajo! Terminaste todas las sumas. 🎉</div>';
      aumentarOrbe('comida');
      setTimeout(() => window.location.href = 'mascota.html', 4000);
      return;
    }

    const a = generarNumeroFacil();
    const b = generarNumeroFacil();
    const respuesta = a + b;

    document.getElementById('titulo').textContent = `Suma: Ejercicios con ${a}`;
    document.getElementById('pregunta').textContent = `¿Cuánto es ${a} + ${b}?`;

    const opcionesDiv = document.getElementById('opciones');
    opcionesDiv.innerHTML = '';

    const opciones = new Set();
    opciones.add(respuesta);

    while (opciones.size < 3) {
      const diferencia = Math.floor(Math.random() * 4) + 1;
      const opcion = Math.random() < 0.5 ? respuesta + diferencia : respuesta - diferencia;
      if (opcion > 0) opciones.add(opcion);
    }

    Array.from(opciones)
      .sort(() => Math.random() - 0.5)
      .forEach(op => {
        const btn = document.createElement('button');
        btn.textContent = op;
        btn.onclick = () => verificarRespuesta(op, respuesta, btn);
        opcionesDiv.appendChild(btn);
      });
  }

  function verificarRespuesta(opcion, correcta, boton) {
    const botones = document.querySelectorAll('.options button');
    botones.forEach(b => b.disabled = true);

    if (opcion === correcta) {
      boton.style.backgroundColor = '#a8f5a8';
      mensajeDiv.innerHTML = '<div class="message success">✅ ¡Muy bien! 👍</div>';
      setTimeout(() => {
        preguntas++;
        generarPregunta();
      }, 1200);
    } else {
      boton.style.backgroundColor = '#f8b0b0';
      mensajeDiv.innerHTML = '<div class="message fail">❌ Intenta otra vez.</div>';
      if (vidas > 0) {
        document.getElementById(`vida${vidas}`).src = 'imagenes/VidaMenos.png';
        vidas--;
      }
      setTimeout(() => {
        if (vidas === 0) {
          mensajeDiv.innerHTML = '<div class="message fail">😢 Se acabaron las vidas. ¡Vuelve a intentarlo!</div>';
          setTimeout(() => window.location.href = 'mascota.html', 3500);
        } else {
          preguntas++;
          generarPregunta();
        }
      }, 1500);
    }
  }

  function confirmarSalida() {
    document.getElementById('confirm-exit').style.display = 'block';
  }

  window.onload = generarPregunta;
</script>
</body>
</html>
