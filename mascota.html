<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mascota</title>
  <link rel="stylesheet" href="Estilos/Mascota.css">
  <link rel="icon" type="image/png" href="imagenes/logo.png">
</head>
<body>
  <iframe src="player.html" style="display:none;" allow="autoplay"></iframe>

  <div class="contenedor">

    
    <div class="panel izquierda" id="panel-izquierda">
      <h3>Lista de Tareas</h3>
      <div id="tarea-actual" class="bienvenida"></div>
    </div>

    
    <div class="panel derecha" id="panel-derecha">
      <h3>Menú de Juegos</h3>
      <div class="botones">
        <button onclick="location.href='ejercicio1.html'">➕ Suma</button>
        <button onclick="location.href='ejercicio2.html'">➖ Resta</button>
        <button onclick="location.href='ejercicio3.html'">✖️ Multiplicación</button>
        <button onclick="location.href='ejercicio4.html'">➗ División</button>
        <button onclick="location.href='Examenes.html'">Examenes</button>
        <button onclick="location.href='Tienda.html'">Tienda</button>
      </div>
    </div>

    
    <div class="contenido">
      <div class="nombre-mascota">
        <span id="nombreMascota">Pingüi</span>
        <button id="editar-nombre">✏️</button>
      </div>

      <div class="necesidades">
        <div class="necesidad-container">
          <div class="necesidad" id="comida" style="background-image:url('imagenes/comida.png')"></div>
          <div class="porcentaje" id="comida-texto">100%</div>
        </div>
        <div class="necesidad-container">
          <div class="necesidad" id="sueño" style="background-image:url('imagenes/sueño.png')"></div>
          <div class="porcentaje" id="sueño-texto">100%</div>
        </div>
        <div class="necesidad-container">
          <div class="necesidad" id="felicidad" style="background-image:url('imagenes/felicidad.png')"></div>
          <div class="porcentaje" id="felicidad-texto">100%</div>
        </div>
      </div>

      <img src="imagenes/pet.png" class="pinguino" alt="Mascota">
    </div>

    
    <div id="toggle-izquierda" class="toggle">📋</div>
    <div id="toggle-derecha" class="toggle">🎮</div>

    
    <div class="barra-edicion" id="barra-edicion">
      <input type="text" id="nuevo-nombre" placeholder="Nuevo nombre">
      <button class="aceptar" onclick="guardarNombre()">Aceptar</button>
      <button class="cancelar" onclick="cancelarEdicion()">Cancelar</button>
    </div>

   
    <a href="index.html" class="volver">Volver</a>
  </div>

  <div id="pantalla-carga">
  <div class="loader">
    <img src="imagenes/pet.png" alt="Cargando..." class="cargando">
    <p>Cargando tu mascota...</p>
  </div>
</div>

  <script src="script/mascota.js">
  
  </script>
</body>
</html>
