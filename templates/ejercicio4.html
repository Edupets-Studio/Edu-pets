<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>División - Juego</title>
  <link rel="stylesheet" href="{{ url_for('static', path='Estilos/Ejercicios.css') }}">
</head>
<body>
  <iframe src="/player" class="audio-frame" allow="autoplay"></iframe>

  <div class="header" id="titulo">División: ejercicio de ?</div>
  <div class="hearts">
    <img src="{{ url_for('static', path='assets/images/Vida.png') }}" id="vida1" alt="Vida 1">
    <img src="{{ url_for('static', path='assets/images/Vida.png') }}" id="vida2" alt="Vida 2">
    <img src="{{ url_for('static', path='assets/images/Vida.png') }}" id="vida3" alt="Vida 3">
  </div>

  <main class="container">
    <img src="{{ url_for('static', path='assets/images/pet.png') }}" alt="Pingüino" class="penguin">
    <div class="question" id="pregunta">¿Cuánto es?</div>
    <div class="options" id="opciones"></div>
    <div id="mensaje"></div>
  </main>

  <button class="arrow left" type="button" onclick="confirmarSalida()">Volver</button>

  <div class="confirm-exit" id="confirm-exit" role="dialog" aria-modal="true">
    <p>¿Estás seguro de que quieres salir de la prueba?</p>
    <button class="btn-salir" type="button" onclick="window.location.href='/mascota'">Sí, volver</button>
    <button class="btn-quedar" type="button" onclick="document.getElementById('confirm-exit').style.display='none'">No, me quiero quedar</button>
  </div>

  <script src="{{ url_for('static', path='js/división.js') }}"></script>
</body>
</html>
