<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mascota - EduPets</title>
  <link rel="stylesheet" href="{{ url_for('static', path='Estilos/Mascota.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='assets/images/Logo.png') }}">
</head>
<body>
  <iframe src="/player" class="audio-frame" allow="autoplay"></iframe>

  <main class="contenedor">
    <section class="panel izquierda" id="panel-izquierda">
      <h3>Lista de tareas</h3>
      <div id="tarea-actual" class="bienvenida"></div>
    </section>

    <section class="panel derecha" id="panel-derecha">
      <h3>Menú de juegos</h3>
      <div class="botones">
        <button type="button" onclick="location.href='/ejercicio1'">+ Suma</button>
        <button type="button" onclick="location.href='/ejercicio2'">- Resta</button>
        <button type="button" onclick="location.href='/ejercicio3'">× Multiplicación</button>
        <button type="button" onclick="location.href='/ejercicio4'">÷ División</button>
        <button type="button" onclick="location.href='/examenes'">Exámenes</button>
        <button type="button" onclick="location.href='/tienda'">Tienda</button>
      </div>
    </section>

    <section class="contenido">
      <div class="nombre-mascota">
        <span id="nombreMascota">Pingüi</span>
        <button id="editar-nombre" type="button" aria-label="Editar nombre">✎</button>
      </div>

      <div class="necesidades">
        <div class="necesidad-container">
          <div class="necesidad" id="comida" style="background-image:url('{{ url_for('static', path='assets/images/comida.png') }}')"></div>
          <div class="porcentaje" id="comida-texto">100%</div>
        </div>
        <div class="necesidad-container">
          <div class="necesidad" id="sueno" style="background-image:url('{{ url_for('static', path='assets/images/sueno.png') }}')"></div>
          <div class="porcentaje" id="sueno-texto">100%</div>
        </div>
        <div class="necesidad-container">
          <div class="necesidad" id="felicidad" style="background-image:url('{{ url_for('static', path='assets/images/felicidad.png') }}')"></div>
          <div class="porcentaje" id="felicidad-texto">100%</div>
        </div>
      </div>

      <img src="{{ url_for('static', path='assets/images/pet.png') }}" class="pinguino" alt="Mascota">
    </section>

    <button id="toggle-izquierda" class="toggle" type="button" aria-label="Abrir tareas">☑</button>
    <button id="toggle-derecha" class="toggle" type="button" aria-label="Abrir juegos">▦</button>

    <div class="barra-edicion" id="barra-edicion">
      <input type="text" id="nuevo-nombre" placeholder="Nuevo nombre">
      <button class="aceptar" type="button" onclick="guardarNombre()">Aceptar</button>
      <button class="cancelar" type="button" onclick="cancelarEdicion()">Cancelar</button>
    </div>

    <a href="/" class="volver">Volver</a>
  </main>

  <div id="pantalla-carga">
    <div class="loader">
      <img src="{{ url_for('static', path='assets/images/pet.png') }}" alt="Cargando..." class="cargando">
      <p>Cargando tu mascota...</p>
    </div>
  </div>

  <script src="{{ url_for('static', path='js/mascota.js') }}"></script>
</body>
</html>
