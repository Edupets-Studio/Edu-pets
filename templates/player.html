<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Audio global</title>
</head>
<body>
  <audio id="global-audio" src="{{ url_for('static', path='assets/Mii.mp3') }}" autoplay loop></audio>

  <script>
    const audio = document.getElementById("global-audio");
    audio.volume = 0.5;

    setInterval(() => {
      localStorage.setItem("audioTime", audio.currentTime);
    }, 500);

    audio.currentTime = parseFloat(localStorage.getItem("audioTime")) || 0;
    audio.play().catch(() => {
      audio.muted = true;
    });
  </script>
</body>
</html>
