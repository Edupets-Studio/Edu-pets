<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - EduPets</title>
  <link rel="stylesheet" href="{{ url_for('static', path='Estilos/registro.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='assets/images/Logo.png') }}">
</head>
<body>
  
  <canvas id="symbols" aria-hidden="true"></canvas>
  

  <main class="container">
    <div class="header">
      <h2>Crea tu cuenta</h2>
    </div>
    <div class="main">
      <input type="text" id="usuario" placeholder="Usuario" autocomplete="username">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="new-password">
      <div class="buttons">
        <button type="button" onclick="registrar()">Registrar</button>
        <button type="button" onclick="location.href='/login'">Volver al login</button>
      </div>
    </div>
  </main>

  <button class="volver-button" type="button" onclick="history.back()" aria-label="Volver">←</button>

  <script src="{{ url_for('static', path='js/registro.js') }}"></script>
</body>
</html>
