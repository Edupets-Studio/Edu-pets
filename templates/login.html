<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de sesión - EduPets</title>
  <link rel="stylesheet" href="{{ url_for('static', path='Estilos/login.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', path='assets/images/Logo.png') }}">
</head>
<body>
  <canvas id="symbols" aria-hidden="true"></canvas>

  <main class="container">
    <div class="header">
      <h2>Inicio de sesión</h2>
    </div>
    <div class="main">
      <input type="text" id="usuario" placeholder="Usuario" autocomplete="username">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
      <div class="buttons">
        <button type="button" onclick="login()">Iniciar sesión</button>
        <button type="button" onclick="location.href='/registro'">Registrarse</button>
      </div>
    </div>
  </main>

  <a href="/" class="volver"><span>Volver</span></a>

  <script src="{{ url_for('static', path='js/Login.js') }}"></script>
</body>
</html>
