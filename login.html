<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="Estilos/login.css">
    <link rel="icon" type="image/png" href="imagenes/Logo.png">
 
</head>
<body>
    <canvas id="symbols"></canvas>

    <div class="container">
        <div class="header"><h2>Inicio de sesión</h2></div>
        <div class="main">
            <input type="text" id="usuario" placeholder="Usuario" />
            <input type="password" id="password" placeholder="Contraseña" />
            <div class="buttons">
                <button onclick="login()">Iniciar sesión</button>
                <button onclick="location.href='registro.html'">Registrarse</button>
            </div>
        </div>
    </div>

   <div class="volver">
  <a href="index.html" class="volver"><span>Volver</span></a>
</div>

<style>
.volver {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .6rem 1rem;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
  color: inherit;
  background: #ffffff;
  border: 2px solid transparent;
  border-radius: .6rem;
  box-shadow: 0 6px 14px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: box-shadow .12s ease, opacity .12s;
  user-select: none;
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 40;
  background: transparent;
}

.volver:hover {
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  opacity: 0.98;
}

.volver:active {
  box-shadow: 0 4px 10px rgba(0,0,0,0.07);
}

.volver:focus {
  outline: 3px solid rgba(100, 150, 255, 0.25);
  outline-offset: 3px;
}
</style>


    <script>
        const canvas = document.getElementById('symbols');
        const ctx = canvas.getContext('2d');
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const symbols = ['π','√','∞','∑','∆','≠','≈','∫','∂'];
        const particles = [];
        for(let i=0;i<30;i++){
            particles.push({ x:Math.random()*width, y:Math.random()*height, dx:(Math.random()-0.5)*0.6, dy:(Math.random()-0.5)*0.6, size:Math.random()*30+18, symbol:symbols[Math.floor(Math.random()*symbols.length)], opacity:Math.random()*0.3+0.1 });
        }
        function animate(){
            ctx.clearRect(0,0,width,height);
            particles.forEach(p=>{
                ctx.font = `${p.size}px Segoe UI`;
                ctx.fillStyle = `rgba(0,0,0,${p.opacity})`;
                ctx.fillText(p.symbol,p.x,p.y);
                p.x+=p.dx; p.y+=p.dy;
                if(p.x<0||p.x>width)p.dx*=-1;
                if(p.y<0||p.y>height)p.dy*=-1;
            });
            requestAnimationFrame(animate);
        }
        animate();

        function login() {
            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            if(!usuario || !password){ alert("Por favor completa todos los campos."); return; }

        
            const url = "https://script.google.com/macros/s/AKfycbwYiOX36ZvnL3kyZzzqFFrDOub9_T9E8eSLvJ0uBlu2qYeuTZWlNtZBXY-Q8jqF68r5/exec";

            fetch(`${url}?usuario=${encodeURIComponent(usuario)}&password=${encodeURIComponent(password)}`)
            .then(response => response.json())
            .then(data => {
                if(data.success){
                    alert(data.message);
                    location.href = "mascota.html";
                } else {
                    alert(data.message);
                }
            })
            .catch(error => { console.error(error); alert("Hubo un problema al procesar la solicitud."); });
        }
    </script>
</body>
</html>
